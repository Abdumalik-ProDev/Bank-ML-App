[project]
name = "bank-ml-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abdumalik-ProDev", email = "abdumalikbakhtiyorovwork@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=2.4.0",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.66.1",
    "xgboost>=3.4.1",
    "xlrd>=2.0.2",
]

[project.scripts]
bank-ml-project = "bank_ml_project:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
